# Static hosting for dist/: index.html is always revalidated, so a new deploy shows up immediately.
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript text/css image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # liveness probe for the Docker HEALTHCHECK and Coolify
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(png|svg)$ {
    add_header Cache-Control "public, max-age=604800";
  }
}
